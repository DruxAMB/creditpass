<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <!-- Continuous line drawing — desk scene in neon green on black -->
  <g stroke="#a1fea0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">

    <!-- Laptop outline + screen -->
    <path d="M 520 380 L 520 220 L 880 220 L 880 380 M 520 380 L 880 380 L 920 440 L 480 440 Z" />
    <!-- Screen content: dashboard charts -->
    <path d="M 560 340 L 560 280 L 600 280 L 600 320 L 640 320 L 640 260 L 680 260 L 680 300 L 720 300 L 720 250 L 760 250 L 760 290 L 800 290 L 800 270 L 840 270" />
    <!-- Score circle on screen -->
    <circle cx="720" cy="370" r="12" />
    <path d="M 710 370 L 716 374 L 730 366" />

    <!-- Credit card tilted at angle -->
    <g transform="rotate(-15 1100 500)">
      <path d="M 1000 460 L 1200 460 L 1200 540 L 1000 540 Z" />
      <!-- Card chip -->
      <path d="M 1020 478 L 1050 478 L 1050 496 L 1020 496 Z" />
      <!-- Card number lines -->
      <path d="M 1020 514 L 1060 514 M 1070 514 L 1110 514 M 1120 514 L 1160 514 M 1170 514 L 1190 514" />
      <!-- CreditPass text suggestion -->
      <path d="M 1020 470 L 1024 470 M 1028 470 L 1032 470 M 1036 470 L 1040 470 M 1044 470 L 1048 470 M 1052 470 L 1056 470 M 1060 470 L 1064 470 M 1068 470 L 1072 470 M 1076 470 L 1080 470 M 1084 470 L 1088 470 M 1092 470 L 1096 470" />
    </g>

    <!-- Smartphone -->
    <g transform="rotate(8 380 520)">
      <path d="M 350 440 L 350 600 L 430 600 L 430 440 Z" />
      <path d="M 360 450 L 420 450 L 420 590 L 360 590 Z" />
      <!-- Notification bubble -->
      <circle cx="390" cy="480" r="8" />
      <path d="M 386 480 L 389 483 L 395 477" />
      <!-- App lines -->
      <path d="M 370 500 L 410 500 M 370 510 L 400 510 M 370 530 L 410 530 M 370 540 L 395 540 M 370 560 L 410 560" />
    </g>

    <!-- Coffee cup -->
    <path d="M 280 340 L 280 400 L 340 400 L 340 340 Z" />
    <path d="M 340 350 C 360 350 360 390 340 390" />
    <!-- Steam -->
    <path d="M 295 320 C 290 310 300 300 295 290 C 290 280 300 270 295 260" />
    <path d="M 315 320 C 320 310 310 300 315 290 C 320 280 310 270 315 260" />

    <!-- Connecting verification paths — blockchain nodes -->
    <circle cx="500" cy="300" r="4" />
    <circle cx="700" cy="180" r="4" />
    <circle cx="950" cy="250" r="4" />
    <circle cx="1150" cy="400" r="4" />
    <circle cx="1300" cy="200" r="4" />
    <circle cx="1450" cy="350" r="4" />
    <circle cx="1600" cy="280" r="4" />
    <circle cx="400" cy="650" r="4" />
    <circle cx="650" cy="700" r="4" />
    <circle cx="900" cy="650" r="4" />
    <circle cx="1200" cy="700" r="4" />
    <circle cx="1500" cy="650" r="4" />

    <!-- Node connections -->
    <path d="M 500 300 L 700 180 L 950 250 L 1150 400 L 1300 200 L 1450 350 L 1600 280" />
    <path d="M 500 300 L 400 650 L 650 700 L 900 650 L 1200 700 L 1500 650" />
    <path d="M 700 180 L 650 700" />
    <path d="M 950 250 L 900 650" />
    <path d="M 1150 400 L 1200 700" />
    <path d="M 1300 200 L 1500 650" />

    <!-- Geometric proof fragments -->
    <path d="M 1400 500 L 1440 500 L 1440 540 L 1400 540 Z" />
    <path d="M 1410 510 L 1430 530 M 1430 510 L 1410 530" />
    <path d="M 250 600 L 290 600 L 270 640 Z" />
    <path d="M 1650 450 L 1690 450 L 1670 490 Z" />
    <path d="M 1660 460 L 1680 480 M 1680 460 L 1660 480" />

    <!-- Scale (credit scoring) -->
    <g transform="translate(1050 200)">
      <path d="M 0 0 L 0 60 M -40 60 L 40 60 M -40 60 L -60 30 L -20 30 Z M 40 60 L 20 30 L 60 30 Z" />
      <circle cx="0" cy="0" r="4" />
    </g>

    <!-- Ethereum diamond logos as nodes -->
    <g transform="translate(300 250)">
      <path d="M 0 -12 L 10 0 L 0 18 L -10 0 Z M 0 -12 L 10 0 L 0 6 L -10 0 Z" />
    </g>
    <g transform="translate(1700 600)">
      <path d="M 0 -12 L 10 0 L 0 18 L -10 0 Z M 0 -12 L 10 0 L 0 6 L -10 0 Z" />
    </g>
    <g transform="translate(600 450)">
      <path d="M 0 -8 L 7 0 L 0 12 L -7 0 Z M 0 -8 L 7 0 L 0 4 L -7 0 Z" opacity="0.6" />
    </g>
  </g>

  <!-- Subtle glow layer -->
  <g stroke="#a1fea0" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.12" filter="blur(2px)">
    <path d="M 520 380 L 520 220 L 880 220 L 880 380 L 920 440 L 480 440 Z" />
    <g transform="rotate(-15 1100 500)">
      <path d="M 1000 460 L 1200 460 L 1200 540 L 1000 540 Z" />
    </g>
    <g transform="rotate(8 380 520)">
      <path d="M 350 440 L 350 600 L 430 600 L 430 440 Z" />
    </g>
    <path d="M 280 340 L 280 400 L 340 400 L 340 340 Z" />
  </g>
</svg>
